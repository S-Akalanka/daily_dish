[project]
name = "pedal_pal"
version = "0.1.0"
description = "Terminal assistant for the Pedal Pal bike shop"
readme = "README.md"
authors = [
    { name = "S-Akalanka", email = "sasiri.akalankaa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "groq>=1.7.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "regex>=2026.9.29",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pedal-pal = "pedal_pal.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
